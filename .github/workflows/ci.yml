name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python roleweave.py examples/synthetic.json
      - run: python desktop.py --web-self-test out/source-web-smoke
  browser-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-test.txt
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node tests/browser-workflow.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-screenshots
          path: out/web-qa/
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python build_windows.py
      - name: Verify the packaged executable using synthetic data
        shell: pwsh
        run: |
          $roleTest = Start-Process -FilePath './out/portable/RoleWeave/RoleWeave.exe' -ArgumentList '--self-test','out/package-smoke' -Wait -PassThru -WindowStyle Hidden
          Get-Content out/package-smoke/report.json
          if ($roleTest.ExitCode -ne 0) { exit 1 }
          $roleReport = Get-Content out/package-smoke/report.json -Raw | ConvertFrom-Json
          if (-not $roleReport.ok -or -not $roleReport.frozen) { exit 1 }
          $webTest = Start-Process -FilePath './out/portable/RoleWeave/RoleWeave.exe' -ArgumentList '--web-self-test','out/package-web-smoke' -Wait -PassThru -WindowStyle Hidden
          if ($webTest.ExitCode -ne 0) { exit 1 }
          $webReport = Get-Content out/package-web-smoke/report.json -Raw | ConvertFrom-Json
          if (-not $webReport.ok -or -not $webReport.frozen) { exit 1 }
          if (-not $webReport.resume_import -or -not $webReport.managed_recovery -or -not $webReport.document_studio) { exit 1 }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install chromium --only-shell
      - name: Verify the complete packaged browser workflow with synthetic data
        shell: pwsh
        run: |
          $env:ROLEWEAVE_PACKAGE = (Resolve-Path './out/portable/RoleWeave/RoleWeave.exe').Path
          node tests/browser-workflow.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: RoleWeave-0.20.0-windows-x64
          path: out/RoleWeave-0.20.0-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-runtime-smoke
          path: out/package-smoke/report.json

      - name: Build per-user installer
        shell: pwsh
        run: python build_installer.py --compiler "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      - name: Verify isolated install, upgrade and uninstall preserve user data
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'roleweave-install-smoke'
          $dataRoot = Join-Path $env:LOCALAPPDATA 'RoleWeave'
          if (Test-Path $dataRoot) { throw 'Synthetic data path must be absent' }
          New-Item -ItemType Directory -Path $dataRoot | Out-Null
          Set-Content (Join-Path $dataRoot 'preserve-me.txt') 'synthetic-preservation-marker'
          $setup = Resolve-Path out/RoleWeave-0.20.0-windows-x64-setup.exe
          $arguments = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $installRoot + '"'))
          1..2 | ForEach-Object {
            $process = Start-Process $setup -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw 'Setup failed' }
          }
          $smoke = Join-Path $env:RUNNER_TEMP 'roleweave-installed-smoke'
          $process = Start-Process (Join-Path $installRoot 'RoleWeave.exe') -ArgumentList @('--self-test', $smoke) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Installed runtime failed' }
          $report = Get-Content (Join-Path $smoke 'report.json') -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.frozen) { throw 'Installed report failed' }
          $process = Start-Process (Join-Path $installRoot 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or (Test-Path (Join-Path $installRoot 'RoleWeave.exe'))) { throw 'Uninstall failed' }
          if ((Get-Content (Join-Path $dataRoot 'preserve-me.txt')) -ne 'synthetic-preservation-marker') { throw 'User data changed' }
      - uses: actions/upload-artifact@v4
        with:
          name: RoleWeave-0.20.0-windows-x64-setup
          path: out/RoleWeave-0.20.0-windows-x64-setup.exe
          if-no-files-found: error

      - name: Hash the closed release artifacts
        shell: pwsh
        run: |
          $files = @('out/RoleWeave-0.20.0-windows-x64.zip', 'out/RoleWeave-0.20.0-windows-x64-setup.exe')
          $lines = foreach ($file in $files) {
            $item = Get-FileHash -LiteralPath $file -Algorithm SHA256
            $item.Hash.ToLowerInvariant() + '  ' + (Split-Path $file -Leaf)
          }
          $lines | Set-Content -LiteralPath out/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: RoleWeave-0.20.0-release-evidence
          path: |
            out/SHA256SUMS.txt
            out/package-smoke/report.json
          if-no-files-found: error
